workflows:
  android-build-v4:
    name: Android Build - THE SOURCE FINAL
    instance_type: mac_mini_m1
    max_build_duration: 60
    
    environment:
      node: 16.18.0 
      xcode: 14.3.1 
      
    integrations:
      # Conexión con GitHub
      - github

    scripts:
      - name: Instalar Dependencias
        script: |
          npm install -g eas-cli
          npm install

      - name: Build and Sign APK
        script: |
          eas build --profile production --platform android --non-interactive
          
    artifacts:
      - build/app/build/outputs/apk/**/*.apk
    
    triggering:
      events:
        - push
      branch:
        - main
